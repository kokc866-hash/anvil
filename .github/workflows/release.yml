name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ANVIL_ELECTRON_BUILD: "1"
      - run: node scripts/pack-ui.mjs
      - run: npx electron-builder --win nsis zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.5' }}
          name: Anvil 1.2.5
          generate_release_notes: true
          files: |
            dist-win/*.exe
            dist-win/*.zip
          body: |
            **Anvil 1.2.5** (2026-09-05)

            - **Setup** räumt Temp, beendet laufendes Anvil, dann installiert
            - **ZIP** statt portable-exe (portable hat C:\Temp vollgemüllt)
            - Paket ohne Monaco/WebLLM-Duplikate

            Wenn Setup bei `WinShell.dll` / Temp scheitert: C: Platz machen **oder ZIP nach I:\ entpacken**.

            - To-do-Quelle einstellbar: Auto / Anvil / Helfer / Agent
            - Run-Fenster zeigt die laufende Datei
            - Neuer Auftrag wischt altes Ask-Ziel im Journal
            - Temp `anvil-run-*` wird aufgeräumt
            - Loop/Graph aus bleibt aus
            - C++-Writes: echte `#include <…>`, kein `u003c`

            Anleitungen im Repo unter `anleitungen/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
