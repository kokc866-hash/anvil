name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          ANVIL_ELECTRON_BUILD: "1"
      - run: node scripts/pack-ui.mjs
      - run: npx electron-builder --win nsis zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.4' }}
          name: Anvil 1.3.4
          generate_release_notes: true
          files: |
            dist-win/*.exe
            dist-win/*.zip
          body: |
            **Anvil 1.3.4** (2026-09-05)

            Lokal (Ollama/LAN): tot- oder leerer Stream wird nicht mehr retried — das hat das Modell im VRAM gelassen und die GPU bei 0. Erstes Token bis 10 Minuten, Pause danach 3 Minuten. Custom auf LAN wie lokal, Custom auf öffentlicher URL wie Cloud (25s).
            Cloud/Abo unverändert: Header sofort, tot-Leitung 25s, Slider 0 = kein Job-Limit.

            ZIP ist kein Portable-Exe. Ordner wählen, `Anvil.exe` starten.

            Anleitungen im Repo unter `anleitungen/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
