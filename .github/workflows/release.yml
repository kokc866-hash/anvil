name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          ANVIL_ELECTRON_BUILD: "1"
      - run: node scripts/pack-ui.mjs
      - run: npx electron-builder --win nsis zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.9' }}
          name: Anvil 1.3.9
          generate_release_notes: true
          files: |
            dist-win/*.exe
            dist-win/*.zip
          body: |
            **Anvil 1.3.9** (2026-09-05)

            Lokal wieder wie 1.2.6: POST /v1/chat/completions über die Pipe, ohne URL-Rewrite und ohne Think-Zwang. Cloud/Abo unverändert (Header sofort, Slider 0 = kein Limit).

            ZIP ist kein Portable-Exe. Ordner wählen, `Anvil.exe` starten.

            Anleitungen im Repo unter `anleitungen/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
