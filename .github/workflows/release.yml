name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - package.json
      - src/lib/version.ts
      - anleitungen/releases/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release downloads after all package checks pass'
        type: boolean
        default: false
      signed:
        description: 'Require publisher metadata and verified Windows signatures'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: anvil-release
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      signed: ${{ steps.release.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        id: release
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
            const source = fs.readFileSync('src/lib/version.ts', 'utf8');
            if (!source.includes(`ANVIL_VERSION = "${version}"`)) throw new Error('App version differs from package.json');
            const tag = `v${version}`;
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/${tag}`) throw new Error('Tag differs from app version');
            if (!fs.existsSync(`anleitungen/releases/${tag}.md`)) throw new Error('Release notes missing');
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('signed', context.eventName === 'workflow_dispatch' && context.payload.inputs?.signed === 'true' ? 'true' : 'false');
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!data.draft) {
                core.notice(`${tag} is already published; keeping existing downloads.`);
                core.setOutput('publish', 'false');
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('publish', context.ref === `refs/tags/${tag}` || (context.eventName === 'workflow_dispatch' && context.payload.inputs?.publish === 'true') ? 'true' : 'false');

  verify:
    needs: metadata
    if: needs.metadata.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Signed release identity and support gate
        if: needs.metadata.outputs.signed == 'true'
        run: node scripts/verify-release-readiness.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Tool compatibility, transports and permissions
        run: npm run test:tools:browser
      - name: Editor documents, persistence, workers and navigation
        run: npm run test:editor
      - name: Canvas, Run, inputs and popout
        run: npm run test:canvas:browser
      - name: Production Canvas build
        run: npm run build
        env:
          ANVIL_ELECTRON_BUILD: "1"
      - name: Production editor and local formatting
        run: npm run test:editor:release
      - name: Minified Canvas runtime and TypeScript modules
        run: npm run test:canvas:release
      - name: Learned tool calls, settings and persisted mappings in production
        run: npm run test:tools:learning -- --production
      - name: Chat send, Stop and retry
        run: npm run test:chat-send

  windows:
    needs: [metadata, verify]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:connections
      - run: npm run test:engines
      - name: Electron storage, restart, CLI access and Canvas capture
        run: node scripts/verify-electron-ipc.mjs
        timeout-minutes: 3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Native Windows Run (Zig 0.16 and Python 3.12)
        run: node scripts/verify-native-windows.mjs
        timeout-minutes: 10
      - run: npm run build
        env:
          ANVIL_ELECTRON_BUILD: "1"
      - name: Desktop onboarding, interactive help and tour
        run: node scripts/product-experience.browser.mjs
        timeout-minutes: 5
      - name: Service login, automatic reconnect and Neon compatibility
        run: node scripts/services.browser.mjs
        timeout-minutes: 5
      - name: Marketplace search stability and cancellation
        run: node scripts/market.browser.mjs
        timeout-minutes: 3
      - run: node scripts/pack-ui.mjs
      - name: Unsigned Windows packages
        if: needs.metadata.outputs.signed != 'true'
        run: npx electron-builder --win nsis zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Signed release package
        if: needs.metadata.outputs.signed == 'true'
        run: npx electron-builder --win nsis zip --publish never --config.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Verify publisher and timestamp on app and setup
        if: needs.metadata.outputs.signed == 'true'
        run: ./scripts/verify-signatures.ps1
        shell: pwsh
      - run: ./scripts/verify-installer.ps1
        shell: pwsh
      - name: Portable ZIP launch and restart without external Node
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist-win -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Portable ZIP missing' }
          node scripts/verify-portable.mjs $zip.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Portable ZIP acceptance failed' }
      - uses: softprops/action-gh-release@v3
        if: needs.metadata.outputs.publish == 'true'
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anvil ${{ needs.metadata.outputs.version }}
          body_path: anleitungen/releases/${{ needs.metadata.outputs.tag }}.md
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            dist-win/*.exe
            dist-win/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: needs.metadata.outputs.publish != 'true'
        with:
          name: Anvil-local-unsigned-test
          path: |
            dist-win/*.exe
            dist-win/*.zip
