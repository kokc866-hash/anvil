name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          ANVIL_ELECTRON_BUILD: "1"
      - run: node scripts/pack-ui.mjs
      - run: npx electron-builder --win nsis zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.1' }}
          name: Anvil 1.3.1
          generate_release_notes: true
          files: |
            dist-win/*.exe
            dist-win/*.zip
          body: |
            **Anvil 1.3.1** (2026-09-05)

            Run-Fenster wieder in derselben Session wie der Editor. 1.3.0 hatte `/run` in `temp:anvil-run` gesteckt — BroadcastChannel kam nicht an, Vorschau zeigte **Keine Datei.**, Compile-Output verschwand.

            Isolation bleibt: HTML im iframe (sandbox, kein same-origin). Nicht das ganze Fenster.

            - Tests laufen vor dem Windows-Build
            - Pack prüft, dass Monaco im UI-Build liegt
            - Pointer-Lock / Vollbild für HTML-Spiele wieder erlaubt

            ZIP ist kein Portable-Exe. Ordner wählen, `Anvil.exe` starten.

            Anleitungen im Repo unter `anleitungen/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
