name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ANVIL_ELECTRON_BUILD: "1"
      - run: node scripts/pack-ui.mjs
      - run: npx electron-builder --win nsis zip --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.0' }}
          name: Anvil 1.3.0
          generate_release_notes: true
          files: |
            dist-win/*.exe
            dist-win/*.zip
          body: |
            **Anvil 1.3.0** (2026-09-05)

            Härtung, ohne Electron-Sprung: Run-Fenster isoliert, Pipe-CORS nur Loopback, Rechte standardmäßig aus.

            - **Update:** Einstellungen → Daten prüft GitHub, ZIP in selbst gewählten Ordner, oder Setup
            - **Konto:** GitHub-Gist und Google Drive (App-Daten) für Einstellungen, ohne Keys
            - **HTML-Run:** an (Standard). Agent darf beliebiges HTML. Aus: Einstellungen → Ausgabe
            - **GitHub ZIP:** Ordner wählen, Dateien auf die Platte (nicht nur im Speicher)
            - Codex-Modelle (luna/sol/terra) nicht mehr an api.openai.com

            ZIP ist kein Portable-Exe. Ordner wählen, `Anvil.exe` starten.

            Anleitungen im Repo unter `anleitungen/`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
